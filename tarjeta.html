<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Generador de tarjeta QR de reseñas</title>
<script src="vendor/qrcode.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;background:#f3f1ef}
.panel{max-width:760px;margin:0 auto;padding:18px}
.panel h1{font-size:20px;margin:0 0 4px}
.panel p{color:#666;font-size:14px;margin:0 0 12px}
.panel label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
.panel input,.panel select{width:100%;padding:9px;border:1px solid #d6d0cc;border-radius:8px;font:inherit}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.panel button{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:#7a3e65;color:#fff}
.panel button.sec{background:#e6e0dc;color:#222}
.hojas{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 40px}
.hoja{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);position:relative;overflow:hidden}
.hoja.a6{width:105mm;height:148mm}
.hoja.a4{width:210mm;height:297mm;display:grid;grid-template-columns:105mm 105mm;grid-template-rows:148.5mm 148.5mm}
.tj{position:relative;width:105mm;height:148mm;padding:11mm 9mm 9mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.hoja.a4 .tj{height:148.5mm}
.tj .sup{font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;color:#777}
.tj .nom{font-size:17pt;font-weight:700;line-height:1.15;margin:3mm 0 0;max-width:86mm;word-wrap:break-word}
.tj .lin{width:14mm;height:.6mm;background:var(--c,#7a3e65);margin:4mm 0 5mm}
.tj .qr{width:58mm;height:58mm}
.tj .qr svg{width:100%;height:100%;display:block}
.tj .t1{font-size:12.5pt;font-weight:600;margin:5mm 0 1mm;line-height:1.25}
.tj .t2{font-size:8.5pt;color:#666}
.tj .pie{margin-top:auto;font-size:7pt;color:#999;letter-spacing:.04em}
.tj .ej{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.tj .ej span{transform:rotate(-32deg);font-size:30pt;font-weight:800;letter-spacing:.1em;color:rgba(190,30,30,.16)}
.tj .ejn{font-size:7pt;color:#b21e1e;border:.3mm solid #b21e1e;border-radius:1mm;padding:.6mm 1.5mm;margin-top:2.5mm}
.corte{position:absolute;background:#999}
@media print{
  body{background:#fff}.panel{display:none}.hojas{padding:0;gap:0}
  .hoja{box-shadow:none;page-break-after:always;break-after:page}
}
</style>
<style id="pagina">@page{size:105mm 148mm;margin:0}</style>
</head>
<body>
<div class="panel">
  <h1>Tarjeta QR de reseñas de Google</h1>
  <p>Escribe el nombre del negocio y pega su enlace de reseña. Revisa la vista previa, escanéala con tu móvil y pulsa Imprimir (o Guardar como PDF).</p>
  <label>Nombre del negocio</label><input id="n" value="Tu negocio">
  <label>Enlace de reseña (https://search.google.com/local/writereview?placeid=... o https://g.page/r/.../review)</label><input id="u" value="">
  <label>Color de acento</label><input id="c" type="color" value="#7a3e65" style="height:40px;padding:3px">
  <label>Formato</label>
  <select id="f"><option value="a6">A6 (una tarjeta por página, para imprenta online)</option><option value="a4">A4 con 4 tarjetas y marcas de corte (copistería)</option></select>
  <label><input id="e" type="checkbox" style="width:auto"> Marcar como EJEMPLO</label>
  <div class="row"><button onclick="pintar()">Actualizar vista previa</button><button class="sec" onclick="print()">Imprimir / Guardar PDF</button></div>
</div>
<div class="hojas" id="hojas"></div>
<script>
var P=new URLSearchParams(location.search);
var $=function(i){return document.getElementById(i)};
if(P.get("n"))$("n").value=P.get("n");
if(P.get("u"))$("u").value=P.get("u");
if(P.get("c"))$("c").value="#"+P.get("c").replace("#","");
if(P.get("f"))$("f").value=P.get("f");
if(P.get("ejemplo")==="1")$("e").checked=true;
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}
function svgQR(url){var q=qrcode(0,"M");q.addData(url);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}
function tarjeta(n,url,ej){
  return '<div class="tj"><div class="sup">Tu opinión nos ayuda</div><div class="nom">'+esc(n)+'</div><div class="lin"></div>'+
  '<div class="qr">'+svgQR(url)+'</div><div class="t1">¿Te ha gustado?<br>Déjanos tu reseña en Google</div>'+
  '<div class="t2">Escanea el código con la cámara del móvil</div>'+
  (ej?'<div class="ejn">QR de muestra: no abre ninguna ficha real</div><div class="ej"><span>EJEMPLO</span></div>':'')+
  '<div class="pie">Gracias por tu visita</div></div>';
}
function marcas(){var h="",L=5,W=.2,xs=[0,105,210],ys=[0,148.5,297];
  xs.forEach(function(x){ys.forEach(function(y){
    h+='<div class="corte" style="left:'+(x-L/2)+'mm;top:'+(y-W/2)+'mm;width:'+L+'mm;height:'+W+'mm"></div>';
    h+='<div class="corte" style="left:'+(x-W/2)+'mm;top:'+(y-L/2)+'mm;width:'+W+'mm;height:'+L+'mm"></div>';})});return h;}
function pintar(){
  var n=$("n").value||"Tu negocio",u=$("u").value.trim(),ej=$("e").checked,f=$("f").value;
  if(!u){u="https://search.google.com/local/writereview?placeid=EJEMPLO";ej=true;$("e").checked=true;}
  document.documentElement.style.setProperty("--c",$("c").value);
  var t=tarjeta(n,u,ej),h="";
  if(f==="a4"){h='<div class="hoja a4">'+t+t+t+t+marcas()+'</div>';$("pagina").textContent="@page{size:A4;margin:0}";}
  else{h='<div class="hoja a6">'+t+'</div><div class="hoja a6">'+t+'</div>';$("pagina").textContent="@page{size:105mm 148mm;margin:0}";}
  $("hojas").innerHTML=h;
}
pintar();
</script>
</body>
</html>
